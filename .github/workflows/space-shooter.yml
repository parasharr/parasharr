name: 🚀 Update Space Shooter

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Generate Space Shooter
        uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: parasharr
          output-path: "space-shooter.webp"
          strategy: "random"

      - name: Commit Space Shooter
        uses: EndBug/add-and-commit@v9
        with:
          message: "🚀 Update Space Shooter"
          add: "space-shooter.webp"